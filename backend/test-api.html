<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mise en Place — API Test Console</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 24px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 28px; margin-bottom: 8px; color: #fff; }
.subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; }
.card h2 { font-size: 16px; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.badge.get { background: #1a3a2a; color: #4ade80; }
.badge.post { background: #3a2a1a; color: #fb923c; }
.badge.put { background: #2a2a3a; color: #818cf8; }
.badge.del { background: #3a1a1a; color: #f87171; }
input, textarea { width: 100%; padding: 8px 12px; border: 1px solid #444; border-radius: 6px; background: #111; color: #e0e0e0; font-family: monospace; font-size: 13px; margin-bottom: 8px; }
textarea { min-height: 60px; resize: vertical; }
button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-success { background: #22c55e; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; }
.result { margin-top: 12px; padding: 12px; background: #111; border: 1px solid #333; border-radius: 6px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
.result.ok { border-color: #22c55e; }
.result.err { border-color: #ef4444; }
.status-bar { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; font-size: 13px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; }
.status-dot.green { background: #22c55e; }
.status-dot.red { background: #ef4444; }
.token-display { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
.full-width { grid-column: 1 / -1; }
</style>
</head>
<body>
<h1>Mise en Place — API Test Console</h1>
<p class="subtitle">Backend: http://localhost:8090</p>

<div class="status-bar" id="statusBar">
  <div class="status-dot red" id="statusDot"></div>
  <span id="statusText">Not connected</span>
  <span class="token-display" id="tokenDisplay"></span>
</div>

<div class="grid">
  <!-- Health -->
  <div class="card">
    <h2><span class="badge get">GET</span> /health</h2>
    <button class="btn-primary" onclick="testHealth()">Check Health</button>
    <div class="result" id="healthResult"></div>
  </div>

  <!-- Register -->
  <div class="card">
    <h2><span class="badge post">POST</span> /auth/register</h2>
    <input id="regEmail" placeholder="email" value="chef@test.com">
    <input id="regPass" placeholder="password" value="testpass123">
    <input id="regName" placeholder="display name" value="Test Chef">
    <button class="btn-primary" onclick="testRegister()">Register</button>
    <div class="result" id="registerResult"></div>
  </div>

  <!-- Login -->
  <div class="card">
    <h2><span class="badge post">POST</span> /auth/login</h2>
    <input id="loginEmail" placeholder="email" value="chef@test.com">
    <input id="loginPass" placeholder="password" value="testpass123">
    <button class="btn-primary" onclick="testLogin()">Login</button>
    <div class="result" id="loginResult"></div>
  </div>

  <!-- Me -->
  <div class="card">
    <h2><span class="badge get">GET</span> /me</h2>
    <button class="btn-primary" onclick="testMe()">Get Profile</button>
    <div class="result" id="meResult"></div>
  </div>

  <!-- Create Recipe -->
  <div class="card full-width">
    <h2><span class="badge post">POST</span> /recipes</h2>
    <textarea id="recipeBody">{
  "title": "Pad Thai",
  "description": "Classic Thai stir-fry noodles",
  "source_type": "manual",
  "cuisine": "thai",
  "ingredients": ["200g rice noodles", "2 eggs", "3 tbsp fish sauce", "1 tbsp tamarind paste", "100g bean sprouts", "2 spring onions"],
  "steps": [
    {"order_index": 1, "text": "Soak rice noodles in warm water for 30 minutes until soft, then drain"},
    {"order_index": 2, "text": "Heat wok over high heat, add oil, scramble eggs until just set"},
    {"order_index": 3, "text": "Add drained noodles to wok with fish sauce and tamarind paste, toss for 2 minutes"},
    {"order_index": 4, "text": "Add bean sprouts and spring onions, toss for 30 seconds and serve immediately"}
  ]
}</textarea>
    <button class="btn-primary" onclick="testCreateRecipe()">Create Recipe</button>
    <div class="result" id="createRecipeResult"></div>
  </div>

  <!-- List Recipes -->
  <div class="card">
    <h2><span class="badge get">GET</span> /recipes</h2>
    <button class="btn-primary" onclick="testListRecipes()">List Recipes</button>
    <div class="result" id="listRecipesResult"></div>
  </div>

  <!-- Get Recipe -->
  <div class="card">
    <h2><span class="badge get">GET</span> /recipes/:id</h2>
    <input id="getRecipeId" placeholder="recipe ID (auto-filled after create)">
    <button class="btn-primary" onclick="testGetRecipe()">Get Recipe</button>
    <div class="result" id="getRecipeResult"></div>
  </div>

  <!-- Create Session -->
  <div class="card">
    <h2><span class="badge post">POST</span> /sessions</h2>
    <input id="sessionRecipeIds" placeholder="recipe IDs (comma-separated, auto-filled)">
    <button class="btn-primary" onclick="testCreateSession()">Create Session</button>
    <div class="result" id="createSessionResult"></div>
  </div>

  <!-- Session Lifecycle -->
  <div class="card">
    <h2><span class="badge post">POST</span> Session Lifecycle</h2>
    <input id="sessionId" placeholder="session ID (auto-filled)">
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="btn-success" onclick="testSessionAction('start')">Start</button>
      <button class="btn-primary" onclick="testSessionAction('pause')">Pause</button>
      <button class="btn-primary" onclick="testSessionAction('resume')">Resume</button>
      <button class="btn-primary" onclick="testGetSession()">Get State</button>
    </div>
    <div class="result" id="sessionResult"></div>
  </div>

  <!-- Complete Step -->
  <div class="card">
    <h2><span class="badge post">POST</span> Complete Step</h2>
    <input id="completeSessionId" placeholder="session ID">
    <input id="completeStepId" placeholder="step ID">
    <button class="btn-success" onclick="testCompleteStep()">Complete Step</button>
    <div class="result" id="completeStepResult"></div>
  </div>

  <!-- Run All Tests -->
  <div class="card full-width">
    <h2>Full E2E Test Suite</h2>
    <button class="btn-success" onclick="runAllTests()" style="font-size: 16px; padding: 12px 32px;">Run All Tests</button>
    <div class="result" id="allTestsResult" style="max-height: 400px;"></div>
  </div>
</div>

<script>
const BASE = 'http://localhost:8090';
let token = '';
let lastRecipeId = '';
let lastSessionId = '';
let lastStepIds = [];

function setToken(t) {
  token = t;
  document.getElementById('statusDot').className = 'status-dot green';
  document.getElementById('statusText').textContent = 'Authenticated';
  document.getElementById('tokenDisplay').textContent = 'Token: ' + t.substring(0, 40) + '...';
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(BASE + path, opts);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  return { status: res.status, data, ok: res.ok };
}

function show(id, res) {
  const el = document.getElementById(id);
  el.className = 'result ' + (res.ok ? 'ok' : 'err');
  el.textContent = `[${res.status}] ${JSON.stringify(res.data, null, 2)}`;
}

async function testHealth() {
  const res = await api('GET', '/health');
  show('healthResult', res);
}

async function testRegister() {
  const res = await api('POST', '/auth/register', {
    email: document.getElementById('regEmail').value,
    password: document.getElementById('regPass').value,
    display_name: document.getElementById('regName').value
  });
  show('registerResult', res);
  if (res.ok) setToken(res.data.access_token);
}

async function testLogin() {
  const res = await api('POST', '/auth/login', {
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPass').value
  });
  show('loginResult', res);
  if (res.ok) setToken(res.data.access_token);
}

async function testMe() {
  const res = await api('GET', '/me');
  show('meResult', res);
}

async function testCreateRecipe() {
  const body = JSON.parse(document.getElementById('recipeBody').value);
  const res = await api('POST', '/recipes', body);
  show('createRecipeResult', res);
  if (res.ok) {
    lastRecipeId = res.data.id;
    document.getElementById('getRecipeId').value = lastRecipeId;
    document.getElementById('sessionRecipeIds').value = lastRecipeId;
  }
}

async function testListRecipes() {
  const res = await api('GET', '/recipes');
  show('listRecipesResult', res);
}

async function testGetRecipe() {
  const id = document.getElementById('getRecipeId').value;
  const res = await api('GET', '/recipes/' + id);
  show('getRecipeResult', res);
}

async function testCreateSession() {
  const ids = document.getElementById('sessionRecipeIds').value.split(',').map(s => s.trim());
  const res = await api('POST', '/sessions', { recipe_ids: ids });
  show('createSessionResult', res);
  if (res.ok) {
    lastSessionId = res.data.id;
    lastStepIds = (res.data.steps || []).map(s => s.id);
    document.getElementById('sessionId').value = lastSessionId;
    document.getElementById('completeSessionId').value = lastSessionId;
    if (lastStepIds.length) document.getElementById('completeStepId').value = lastStepIds[0];
  }
}

async function testSessionAction(action) {
  const id = document.getElementById('sessionId').value;
  const res = await api('POST', '/sessions/' + id + '/' + action);
  show('sessionResult', res);
}

async function testGetSession() {
  const id = document.getElementById('sessionId').value;
  const res = await api('GET', '/sessions/' + id);
  show('sessionResult', res);
}

async function testCompleteStep() {
  const sid = document.getElementById('completeSessionId').value;
  const stepId = document.getElementById('completeStepId').value;
  const res = await api('POST', '/sessions/' + sid + '/steps/' + stepId + '/complete');
  show('completeStepResult', res);
}

async function runAllTests() {
  const el = document.getElementById('allTestsResult');
  el.className = 'result';
  const log = (msg) => { el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; };
  el.textContent = '';
  let pass = 0, fail = 0;
  const assert = (name, condition) => { if (condition) { pass++; log('PASS: ' + name); } else { fail++; log('FAIL: ' + name); } };

  log('=== Mise en Place E2E Test Suite ===\n');

  // Health
  let r = await api('GET', '/health');
  assert('Health check returns 200', r.ok);

  // Register
  const email = 'e2e-' + Date.now() + '@test.com';
  r = await api('POST', '/auth/register', { email, password: 'pass123', display_name: 'E2E Tester' });
  assert('Register returns 201', r.status === 201);
  assert('Register returns access_token', !!r.data.access_token);
  assert('Register returns refresh_token', !!r.data.refresh_token);
  const refreshToken = r.data.refresh_token;
  setToken(r.data.access_token);

  // Duplicate register
  r = await api('POST', '/auth/register', { email, password: 'pass123', display_name: 'Dup' });
  assert('Duplicate register returns 409', r.status === 409);

  // Login
  r = await api('POST', '/auth/login', { email, password: 'pass123' });
  assert('Login returns 200', r.ok);
  assert('Login returns access_token', !!r.data.access_token);
  setToken(r.data.access_token);

  // Wrong password
  r = await api('POST', '/auth/login', { email, password: 'wrong' });
  assert('Wrong password returns 401', r.status === 401);

  // Refresh
  r = await api('POST', '/auth/refresh', { refresh_token: refreshToken });
  assert('Refresh returns 200', r.ok);
  assert('Refresh returns new access_token', !!r.data.access_token);
  setToken(r.data.access_token);

  // Me
  r = await api('GET', '/me');
  assert('Get /me returns 200', r.ok);
  assert('Get /me returns user_id', !!r.data.user_id);

  // Unauthenticated
  const savedToken = token; token = '';
  r = await api('GET', '/me');
  assert('Unauthenticated /me returns 401', r.status === 401);
  token = savedToken;

  // Create Recipe 1
  r = await api('POST', '/recipes', {
    title: 'Pad Thai', description: 'Thai noodles', source_type: 'manual', cuisine: 'thai',
    ingredients: ['200g noodles', '2 eggs', '3 tbsp fish sauce'],
    steps: [{ order_index: 1, text: 'Soak noodles' }, { order_index: 2, text: 'Scramble eggs' }, { order_index: 3, text: 'Toss and serve' }]
  });
  assert('Create recipe returns 201', r.status === 201);
  assert('Recipe has id', !!r.data.id);
  assert('Recipe has 3 ingredients', r.data.ingredients?.length === 3);
  assert('Recipe has 3 steps', r.data.steps?.length === 3);
  const recipe1Id = r.data.id;

  // Create Recipe 2
  r = await api('POST', '/recipes', {
    title: 'Green Curry', description: 'Thai curry', source_type: 'manual', cuisine: 'thai',
    ingredients: ['400ml coconut milk', '2 tbsp green curry paste', '200g chicken'],
    steps: [{ order_index: 1, text: 'Heat coconut milk' }, { order_index: 2, text: 'Add curry paste' }, { order_index: 3, text: 'Add chicken, simmer 15 min' }]
  });
  assert('Create second recipe returns 201', r.status === 201);
  const recipe2Id = r.data.id;

  // Missing title
  r = await api('POST', '/recipes', { title: '', source_type: 'manual', ingredients: [], steps: [{ order_index: 1, text: 'x' }] });
  assert('Empty title returns 400', r.status === 400);

  // List recipes
  r = await api('GET', '/recipes');
  assert('List recipes returns 200', r.ok);
  assert('List has at least 2 recipes', r.data.recipes?.length >= 2 || (Array.isArray(r.data) && r.data.length >= 2));

  // Get recipe
  r = await api('GET', '/recipes/' + recipe1Id);
  assert('Get recipe returns 200', r.ok);
  assert('Get recipe has correct title', r.data.title === 'Pad Thai');

  // Create session (single recipe)
  r = await api('POST', '/sessions', { recipe_ids: [recipe1Id] });
  assert('Create session returns 201', r.status === 201);
  assert('Session has steps from recipe', r.data.steps?.length === 3);
  assert('Session status is setup', r.data.status === 'setup');
  const sessionId = r.data.id;
  const stepIds = r.data.steps.map(s => s.id);

  // Start session
  r = await api('POST', '/sessions/' + sessionId + '/start');
  assert('Start session returns 200', r.ok);

  // Get session state
  r = await api('GET', '/sessions/' + sessionId);
  assert('Session status is in_progress', r.data.status === 'in_progress');

  // Pause
  r = await api('POST', '/sessions/' + sessionId + '/pause');
  assert('Pause session returns 200', r.ok);

  // Resume
  r = await api('POST', '/sessions/' + sessionId + '/resume');
  assert('Resume session returns 200', r.ok);

  // Complete steps
  for (let i = 0; i < stepIds.length; i++) {
    r = await api('POST', '/sessions/' + sessionId + '/steps/' + stepIds[i] + '/complete');
    assert('Complete step ' + (i+1) + ' returns 200', r.ok);
  }

  // Session should auto-complete
  r = await api('GET', '/sessions/' + sessionId);
  assert('Session auto-completed after all steps done', r.data.status === 'completed');

  // Delete recipe
  r = await api('DELETE', '/recipes/' + recipe2Id);
  assert('Delete recipe returns 204', r.status === 204);

  // Verify deleted
  r = await api('GET', '/recipes/' + recipe2Id);
  assert('Deleted recipe returns 404', r.status === 404 || r.data === null);

  log('\n=== Results: ' + pass + ' passed, ' + fail + ' failed ===');
  el.className = 'result ' + (fail === 0 ? 'ok' : 'err');
}
</script>
</body>
</html>
